# Scrapes the game server every 10 s (Phase 20.4). In production the metrics need the internal
# secret: Prometheus sends it as a bearer token read from a file, never written in this config.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: game
    metrics_path: /metrics/prometheus
    authorization:
      credentials_file: /tmp/internal-secret
    static_configs:
      - targets: ['game:8080']
