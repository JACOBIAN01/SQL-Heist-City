# Run with:  promtool test rules alerts.test.yml   (docs/operations.md)
rule_files:
  - alerts.yml
evaluation_interval: 10s

tests:
  - name: a slow tick fires after two minutes, a healthy one does not
    interval: 10s
    input_series:
      - series: 'heist_tick_ms{match="class-7",quantile="0.99"}'
        values: '5+0x6 20+0x20'
      - series: 'heist_tick_ms{match="main",quantile="0.99"}'
        values: '5+0x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: TickTooSlow
        exp_alerts: []
      - eval_time: 5m
        alertname: TickTooSlow
        exp_alerts:
          - exp_labels: { severity: critical, match: class-7, quantile: '0.99' }
            exp_annotations:
              summary: 'Tick p99 is 20 ms in class-7 (target under 15)'
              action: Too many players or classes for this machine, or a slow rule. See docs/deployment.md, sizing.

  - name: the game server being unreachable
    interval: 10s
    input_series:
      - series: 'up{job="game"}'
        values: '1x3 0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: GameServerDown
        exp_alerts:
          - exp_labels: { severity: critical, job: game }
            exp_annotations:
              summary: The game server cannot be scraped
              action: Check the container (docker compose ps), its logs, and the database.

  - name: a grader queue that does not drain
    interval: 10s
    input_series:
      - series: 'heist_grader_queue'
        values: '0x3 40x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: GraderBacklog
        exp_alerts: []
      - eval_time: 4m
        alertname: GraderBacklog
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Student answers are waiting for the grader
              action: Runaway queries or too few cores for grading. Look at heist_grader_timeouts.

  - name: a burst of timeouts and anomalies
    interval: 1m
    input_series:
      - series: 'heist_grader_timeouts'
        values: '0+10x12'
      - series: 'heist_anomalies{match="main",kind="speed"}'
        values: '0+30x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: GraderTimeouts
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Many student queries are hitting the time limit
              action: A question may be producing endless queries, or someone is abusing the sandbox. Check the anomaly and fuzz logs.
      - eval_time: 10m
        alertname: CheatAnomalies
        exp_alerts:
          - exp_labels: { severity: warning, match: main }
            exp_annotations:
              summary: 'Many anomalies in main'
              action: Search the logs for msg="anomaly" and group by player (docs/backend.md, anti-cheat).
