# The full stack on one machine (Phase 20.1):  docker compose up --build
#   game       http://localhost:8088        game server  http://localhost:8080
#   admin      http://localhost:8081        PostgreSQL   localhost:54330
# Development settings: dev sign-in is on and the demo secrets are fine here. For a real
# deployment set NODE_ENV=production and your own secrets (docs/deployment.md, "Secrets").
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: heist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heist-local-only}
      POSTGRES_DB: heist
    volumes: ['pgdata:/var/lib/postgresql/data']
    ports: ['54330:5432']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'heist']
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    build: { context: ., target: admin }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://heist:${POSTGRES_PASSWORD:-heist-local-only}@postgres:5432/heist
      GAME_ORIGINS: http://localhost:8088
      GAME_SERVER_URL: http://game:8080
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-not-for-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@heist.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (first start creates the admin)}
      DEV_LOGIN: '1'
    ports: ['8081:8081']

  game:
    build: { context: ., target: server }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://heist:${POSTGRES_PASSWORD:-heist-local-only}@postgres:5432/heist
      GAME_ORIGINS: http://localhost:8088
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-not-for-production}
      MATCH_WORKERS: '0'
    volumes: ['snapshot:/data']
    ports: ['8080:8080']

  web:
    build: { context: ., target: client }
    ports: ['8088:80']

  # Dashboards and alerts (Phase 20.4):  docker compose --profile monitoring up -d
  #   Prometheus http://localhost:9090   Grafana http://localhost:3000 (admin / admin, dashboard "SQL Heist City")
  prometheus:
    profiles: ['monitoring']
    image: prom/prometheus:v3.0.1
    depends_on: [game]
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-not-for-production}
    # The bearer token comes from the environment into a file, so no config holds the secret.
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'printf %s "$$INTERNAL_SECRET" > /tmp/internal-secret && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml',
      ]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['9090:9090']

  grafana:
    profiles: ['monitoring']
    image: grafana/grafana:11.3.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']

volumes:
  pgdata:
  snapshot:
