name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: heist
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: heist_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U heist" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://heist@127.0.0.1:5432/heist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A known high or critical advisory in any dependency blocks the merge (Phase 18.5).
      - run: npm audit --audit-level=high
      - run: npm run ci
      # Browser tests (Phase 23.2): the real game, admin and client on a fresh database.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: |
            test-results/
            playwright-report/
